name: Node.js CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check public/app.js
          node --check public/workspace-utils.js
          node --check server/index.js
          node --check server/lib.js
      - name: Run unit tests
        run: npm test
